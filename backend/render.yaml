services:
  - type: web
    name: bnpl-backend
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python -m app.data.generate_synthetic_data &&
      python -m app.ml.train_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
